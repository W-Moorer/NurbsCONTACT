[build-system]
requires = ["scikit-build-core>=0.10,<1"]
build-backend = "scikit_build_core.build"

[project]
name = "nurbscontact-gpu"
version = "0.1.0"
description = "Fixed-hinge rigid-body mesh contact and generalized-alpha integration on CUDA"
readme = "nurbscontact_gpu/README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "meshio>=5.3"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13.6,<14"]

[project.scripts]
nc-gpu = "nurbscontact_gpu.cli:main"
nc-gpu-map = "nurbscontact_gpu.geometry:main"

[tool.scikit-build]
minimum-version = "0.10"
cmake.source-dir = "nurbscontact_gpu/native"
wheel.packages = ["nurbscontact_gpu"]
wheel.py-api = "py3"
wheel.exclude = ["nurbscontact_gpu/native/**"]
sdist.exclude = ["**"]
sdist.include = ["/pyproject.toml", "/LICENSE", "/nurbscontact_gpu/*.py", "/nurbscontact_gpu/README.md", "/nurbscontact_gpu/kernels/*.cu", "/nurbscontact_gpu/native/CMakeLists.txt", "/nurbscontact_gpu/native/hinge_exchange.cpp"]
